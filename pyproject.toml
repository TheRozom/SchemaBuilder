[tool.poetry]
name = "schema-builder"
version = "0.1.0"
description = "JSON Schema Builder"
authors = ["Antigravity <antigravity@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
orjson = "^3.9.0"
genson = "^1.2.2"
jsonschema = "^4.20.0"
faker = "^22.0.0"
sentence-transformers = "^2.3.0"
numpy = "^2.0.0"
pandas = "^2.1.0"
scipy = "^1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.1"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
